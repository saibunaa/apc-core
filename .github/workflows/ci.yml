name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: pytest -q
      - name: Verify required mutation origin fails closed
        run: |
          set -euo pipefail
          if env -u APC_CORE_ALLOWED_MUTATION_ORIGINS docker compose config --quiet; then
            echo "Compose config unexpectedly accepted an unset mutation origin" >&2
            exit 1
          fi
          if APC_CORE_ALLOWED_MUTATION_ORIGINS= docker compose config --quiet; then
            echo "Compose config unexpectedly accepted an empty mutation origin" >&2
            exit 1
          fi
      - name: Verify rendered Compose deployment boundary
        run: |
          set -euo pipefail
          rendered="$(APC_CORE_ALLOWED_MUTATION_ORIGINS=https://ci.invalid docker compose config)"
          printf '%s\n' "$rendered" | grep -F "APC_CORE_ALLOWED_MUTATION_ORIGINS: https://ci.invalid"
          if printf '%s\n' "$rendered" | grep -Eq '^[[:space:]]*ports:'; then
            echo "Rendered Compose config must not expose host ports" >&2
            exit 1
          fi
